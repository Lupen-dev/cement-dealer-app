{% extends "base.html" %}

{% block title %}Add Collection - Cement Dealer Management{% endblock %}

{% block content %}
<div class="card">
    <h2><i class="fas fa-plus-circle"></i> Record Payment Collection</h2>
    
    <form method="POST" style="max-width: 600px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label for="order_id"><i class="fas fa-boxes"></i> Select Order *</label>
                <select id="order_id" name="order_id" required>
                    <option value="">-- Select an order --</option>
                    {% for order in pending_orders %}
                    <option value="{{ order.id }}">
                        Order #{{ order.id }} - {{ order.customer.name }} (Remaining: ₺{{ "%.2f"|format(order.remaining_amount) }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label for="amount"><i class="fas fa-coins"></i> Payment Amount (₺) *</label>
                <input type="number" id="amount" name="amount" step="0.01" required placeholder="0.00">
            </div>
            
            <div class="form-group" style="grid-column: 1 / -1;">
                <label for="payment_method_id"><i class="fas fa-credit-card"></i> Payment Method *</label>
                <select id="payment_method_id" name="payment_method_id" required>
                    <option value="">-- Select payment method --</option>
                    {% for method in payment_methods %}
                    <option value="{{ method.id }}">{{ method.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label for="notes"><i class="fas fa-sticky-note"></i> Notes</label>
            <textarea id="notes" name="notes" placeholder="Add payment details or reference number..."></textarea>
        </div>
        
        <div class="btn-group">
            <button type="submit" class="btn btn-success"><i class="fas fa-check"></i> Record Payment</button>
            <a href="{{ url_for('collections') }}" class="btn"><i class="fas fa-times"></i> Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
