{% extends "base.html" %}

{% block title %}Add Customer - Cement Dealer Management{% endblock %}

{% block content %}
<div class="card">
    <h2><i class="fas fa-user-plus"></i> Add New Customer</h2>
    
    <form method="POST" style="max-width: 600px;">
        <div class="form-group">
            <label for="name"><i class="fas fa-user"></i> Customer Name *</label>
            <input type="text" id="name" name="name" required placeholder="Enter customer name">
        </div>
        
        <div class="form-group">
            <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+90 555 123 4567">
        </div>
        
        <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" id="email" name="email" placeholder="customer@example.com">
        </div>
        
        <div class="form-group">
            <label for="address"><i class="fas fa-map-pin"></i> Address</label>
            <textarea id="address" name="address" placeholder="Enter full address"></textarea>
        </div>
        
        <div class="btn-group">
            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Save Customer</button>
            <a href="{{ url_for('customers') }}" class="btn"><i class="fas fa-times"></i> Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
