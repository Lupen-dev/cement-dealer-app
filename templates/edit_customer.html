{% extends "base.html" %}

{% block title %}Edit Customer - Cement Dealer Management{% endblock %}

{% block content %}
<div class="card">
    <h2><i class="fas fa-user-edit"></i> Edit Customer - {{ customer.name }}</h2>
    
    <form method="POST" style="max-width: 600px;">
        <div class="form-group">
            <label for="name"><i class="fas fa-user"></i> Customer Name *</label>
            <input type="text" id="name" name="name" value="{{ customer.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
            <input type="tel" id="phone" name="phone" value="{{ customer.phone or '' }}">
        </div>
        
        <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" id="email" name="email" value="{{ customer.email or '' }}">
        </div>
        
        <div class="form-group">
            <label for="address"><i class="fas fa-map-pin"></i> Address</label>
            <textarea id="address" name="address">{{ customer.address or '' }}</textarea>
        </div>
        
        <div class="btn-group">
            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Update Customer</button>
            <a href="{{ url_for('customer_detail', customer_id=customer.id) }}" class="btn"><i class="fas fa-times"></i> Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
